<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שמע</title>
<link rel="icon" href="/home/icon.svg" type="image/svg+xml">
<script src="/home/qrcode.js"></script>
<style>
:root{
  --bg:#13100e; --surface:#1c1815; --surface2:#25201c; --surface3:#2f2924; --line:rgba(255,236,214,.11);
  --line2:rgba(255,236,214,.16); --ink:#f4ede5; --dim:#b1a597; --faint:#958a7d; --accent:#eaa45e;
  --accent-ink:#1b130b; --sage:#86bba8; --rose:#e48a7f; --sky:#8fb3e0; --gold:#ffd36b; --r:14px; color-scheme:dark;
  --p0:#eaa45e; --p1:#86bba8; --p2:#8fb3e0; --p3:#e48a7f; --p4:#c9a3e6; --p5:#d8c37a; --unk:#6f665c;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Heebo,Arial,sans-serif}
.pairbtn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:5px 12px;font-weight:700}
.pair{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.pair .qr{background:#fff;padding:12px;border-radius:12px;line-height:0}
.pair .qr img{width:240px;height:240px;image-rendering:pixelated}
.pair .qr.small img{width:120px;height:120px}
.pair ol{margin:0;padding-inline-start:20px;flex:1;min-width:220px}
.pair ol li{margin:4px 0}
.pair code{direction:ltr;display:inline-block;background:var(--surface2);border-radius:6px;padding:1px 6px;font-size:13px;user-select:all}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;font-weight:800}
.top .logo{width:40px;height:40px;border-radius:11px;flex:none}
.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:8px 14px;color:var(--dim);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tabs a .n{background:var(--rose);color:#200c09;border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:4px;font-weight:700}
.teach{display:grid;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.tcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);cursor:default}
.tcard .txt{font-size:16px;margin:4px 0 8px}
.tcard audio{width:100%;height:34px}
.tcard .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tcard .opts button{background:var(--surface2);border:1px solid var(--line2);border-radius:18px;padding:5px 12px;font-size:14px}
.tcard .opts button:hover{border-color:var(--accent)}
.tcard .opts .guess{background:rgba(234,164,94,.16);border-color:var(--accent);color:var(--accent);font-weight:700}
.tcard .opts kbd{font:11px monospace;color:var(--faint);margin-inline-start:5px}
.progress{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.sgroups{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.sgroups .chip{font-size:14px;padding:4px 12px;cursor:pointer}
.sgroups .chip.on{background:var(--accent);color:var(--accent-ink)}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.srow .ic{font-size:22px;width:30px;text-align:center}
.srow .nm{font-weight:700;min-width:120px}
.srow .src{color:var(--faint);font-size:12px}
.srow audio{height:30px;flex:1 1 220px;min-width:0}
.srow .fix{color:var(--accent);border:1px solid var(--line2);border-radius:14px;padding:2px 10px;font-size:13px}
.srow input{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:4px 8px;font:inherit;width:170px}
.store{background:var(--surface2);border:1px solid var(--line2);border-radius:16px;padding:3px 10px;font-size:13px;color:var(--dim)}
.store:hover{border-color:var(--accent)}
.meter{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:8px 0}
.kv span:nth-child(odd){color:var(--faint)}
.utt.media{opacity:.75}
.utt.media .body{color:var(--faint);font-style:italic}
.utt.media .who{color:var(--faint)!important}
.chip.media{background:rgba(143,179,224,.14);color:var(--sky)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.pcard .nm{font-size:18px;font-weight:800}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin:8px 0 2px;direction:ltr}
.spark i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.spark i.z{background:var(--surface3)}
.pcard .meta{color:var(--faint);font-size:13px}
.pcard .last{color:var(--dim);font-size:14px;margin-top:6px;border-inline-start:3px solid var(--line2);padding-inline-start:8px}
.status{margin-inline-start:auto;color:var(--faint);font-size:13px}
.alarm{margin-top:12px;padding:12px 16px;border-radius:var(--r);background:rgba(229,72,77,.16);border:1px solid #e5484d;color:#ffd6d3;font-weight:600}
.alarm small{display:block;font-weight:400;color:#f0b7b2}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pcard.on{border-color:rgba(229,72,77,.5)}
.pcard h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .dot{width:11px;height:11px;border-radius:50%;background:var(--unk);flex:none}
.pcard.live .dot{background:var(--sage)} .pcard.on .dot{background:#e5484d;animation:pulse 1.8s infinite}
.pcard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pcard .pill{font-size:12px;padding:2px 9px;border-radius:12px;background:var(--surface3);color:var(--dim)}
.pcard .pill.ts{background:rgba(143,179,224,.16);color:var(--sky)} .pcard .pill.warn{background:rgba(228,138,127,.18);color:var(--rose)}
.strip{display:grid;grid-template-columns:repeat(96,1fr);gap:1px;margin-top:10px;direction:ltr;height:16px}
.strip i{display:block;border-radius:1px;background:var(--surface3)}
.strip i.rec{background:var(--sage)} .strip i.private,.strip i.cal,.strip i.mute,.strip i.pause{background:#c9a3e6}
.strip i.battery{background:var(--rose)} .strip i.busy{background:var(--accent)} .strip i.unknown{background:#e5484d}
.strip i.nolog{background:#3a342e}
.strip i.off,.strip i.killed,.strip i.stall{background:#8a4a47} .strip i.away,.strip i.enroll_needed{background:#5c554d} .strip i.future{background:transparent;border:1px dashed var(--line)}
.stripaxis{display:flex;justify-content:space-between;direction:ltr;font-size:10px;color:var(--faint);margin-top:2px}
.legend2{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--faint);margin-top:6px}
.legend2 b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:3px;vertical-align:middle}
button.gold{font-size:11px;color:var(--faint);border:1px solid var(--line2);border-radius:10px;padding:0 8px;margin-inline-start:6px}
button.gold:hover{color:var(--gold);border-color:var(--gold)}
.source{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line2)}
.source .dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--unk)}
.source.on .dot{background:#e5484d;box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:pulse 1.8s infinite}
.source.idle .dot{background:var(--accent)}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.source b{font-size:15px}
.source .sub{color:var(--faint);font-size:13px}
.source .pc{margin-inline-start:auto;font-size:13px;color:var(--dim);background:var(--surface2);border-radius:20px;padding:4px 12px}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px}
.days button{background:var(--surface2);border:1px solid var(--line2);border-radius:20px;padding:5px 12px;white-space:nowrap;font-size:14px}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .act{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--accent);border:1px solid var(--line2);border-radius:16px;padding:2px 10px}
.live{border-color:rgba(229,72,77,.35)}
.live .proc{font-size:12px;color:var(--accent);font-weight:500}
.live .empty{padding:14px 0;text-align:start}
.ribbon{position:relative;height:46px;background:var(--surface2);border-radius:10px;overflow:hidden;direction:ltr}
.ribbon .blk{position:absolute;top:6px;bottom:14px;border-radius:4px;min-width:3px;cursor:pointer}
.ribbon .snd{position:absolute;bottom:0;font-size:11px;transform:translateX(-50%)}
.hours{display:flex;justify-content:space-between;direction:ltr;color:var(--faint);font-size:11px;margin-top:2px}
.talk{display:flex;gap:10px;flex-wrap:wrap}
.talk .p{background:var(--surface2);border-radius:12px;padding:8px 12px;min-width:120px}
.talk .p b{display:block}
.talk .p small{color:var(--faint)}
.conv{cursor:pointer;transition:border-color .15s}
.conv:hover{border-color:var(--line2)}
.when{color:var(--faint);font-size:13px}
.topic{font-weight:700;font-size:16px}
.sum{color:var(--dim);margin:4px 0}
.mood{color:var(--faint);font-style:italic;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:12px;background:var(--surface3);color:var(--dim)}
.chip.sig{background:rgba(134,187,168,.15);color:var(--sage)}
.chip.prov{background:rgba(234,164,94,.15);color:var(--accent)}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--surface3)}
.bar span{display:block;height:100%}
.empty{color:var(--faint);text-align:center;padding:40px 10px}
.back{color:var(--dim);border:1px solid var(--line2);padding:5px 12px;border-radius:20px;font-size:14px}
.utt{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.utt .who{width:104px;flex:none;font-weight:700;font-size:14px;text-align:start;padding:0;line-height:1.3}
.utt .who small{display:block;font-weight:400;font-size:11px;color:var(--faint)}
.utt .who:hover{text-decoration:underline dotted}
.utt .body{flex:1;min-width:0}
.utt .t{color:var(--faint);font-size:11px;direction:ltr;display:inline-block}
.utt .feel{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.utt .feel span{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--surface3);color:var(--dim)}
.utt .feel .hi{background:rgba(234,164,94,.18);color:var(--accent)}
.utt .feel .lo{background:rgba(143,179,224,.16);color:var(--sky)}
.legend{color:var(--faint);font-size:12px;margin-top:8px}
svg.tone{width:100%;height:90px;display:block}
.moment{border-inline-start:3px solid var(--accent);padding:2px 10px;margin:6px 0}
.pp{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:14px}
.pp b{white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.sheet .box{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:16px;max-width:480px;width:100%;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet .q{color:var(--dim);font-size:14px;margin-bottom:8px}
.sheet audio{width:100%;height:34px;margin:6px 0 10px}
.sheet .grp{color:var(--faint);font-size:12px;margin:10px 0 4px}
.sheet .opts{display:flex;flex-wrap:wrap;gap:6px}
.sheet .opts button{background:var(--surface2);border:1px solid var(--line2);border-radius:18px;padding:5px 12px;font-size:14px}
.sheet .opts button:hover{border-color:var(--accent)}
.sheet .new{display:flex;gap:6px;margin-top:12px}
.sheet input{flex:1;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:6px 10px;font:inherit}
.sheet .ok{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 14px;font-weight:700}
.sheet .x{float:left;color:var(--faint);font-size:20px;line-height:1}
.card .new{display:flex;gap:6px;margin-top:10px}
.card input,.card select,.card textarea{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;color:var(--ink);padding:6px 10px;font:inherit}
.card .ok{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:6px 14px;font-weight:700;border:0;cursor:pointer}
mark{background:rgba(234,164,94,.3);color:inherit;border-radius:3px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface3);border:1px solid var(--line2);
  border-radius:12px;padding:10px 16px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="logo" src="/home/icon.svg" alt=""><h1>שמע</h1><button class="pairbtn" id="pairbtn">📱 חבר טלפון</button><button class="store" id="store" title="מקום בדיסק">📦 …</button><span class="status" id="status"></span></div>
  <div id="alarm"></div>
  <div id="phones"></div>
  <nav class="tabs" id="tabs">
    <a href="#" data-t="day">היום ושיחות</a>
    <a href="#teach" data-t="teach">ללמד קולות<span class="n" id="teachn" hidden></span></a>
    <a href="#sounds" data-t="sounds">צלילים</a>
    <a href="#people" data-t="people">אנשים</a>
    <a href="#search" data-t="search">חיפוש ומשימות<span class="n" id="taskn" hidden></span></a>
    <a href="#me" data-t="me">אני</a>
    <a href="#privacy" data-t="privacy">פרטיות</a>
    <a href="#system" data-t="system">מערכת</a>
  </nav>
  <div id="livebox"></div>
  <div class="days" id="days"></div>
  <div id="main"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const J = async u => (await fetch(u)).json();
const POST = async (u, b) => (await fetch(u, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)})).json();
const COLORS = ["--p0","--p1","--p2","--p3","--p4","--p5"];
const colorOf = (() => { const m = {}; let k = 0;
  return n => n ? (m[n] ||= `var(${COLORS[k++ % COLORS.length]})`) : "var(--unk)"; })();
const hm = iso => iso ? iso.slice(11, 16) : "";
const hms = iso => iso ? iso.slice(11, 19) : "";
const first = n => n ? n.split(" ")[0] : "לא מזוהה";
const mins = s => s >= 60 ? `${Math.round(s / 60)} דק׳` : `${Math.round(s)} שנ׳`;
const moodColor = v => v == null ? "var(--unk)" : v >= .58 ? "var(--sage)" : v <= .42 ? "var(--rose)" : "var(--accent)";
const SND = {"דלת":"🚪","דלת הזזה":"🚪","טריקה":"💥","דפיקה בדלת":"✊","פעמון דלת":"🔔","ארון נפתח/נסגר":"🗄","מגירה":"🗄",
  "חריקה":"🪑","חריקת רהיט/דלת":"🪑","גרירת כיסא/רהיט":"🪑","מפתחות":"🔑","זכוכית":"🥛","משהו נשבר":"💔","כדור קופץ":"⚽","כדור":"⚽",
  "מיקרוגל":"📟","צפצוף מיקרוגל":"📟","בלנדר":"🌀","סכו\"ם":"🍴","חיתוך":"🔪","טיגון":"🍳","רתיחה/קומקום":"♨","קומקום":"♨","ברז":"🚰",
  "כיור":"🚰","מזיגה":"🥤","הורדת מים":"🚽","אמבטיה/מקלחת":"🛁","פן":"💨","צחצוח שיניים":"🪥","מאוורר":"💨","מזגן":"❄",
  "צפצוף":"📟","אזעקה/התראה":"⏰","שעון מעורר":"⏰","גלאי עשן":"🚨","טלפון מצלצל":"📱","רינגטון":"📱","הקלדה":"⌨","מדפסת":"🖨",
  "גיטרה":"🎸","פסנתר":"🎹","קלידים":"🎹","תופים":"🥁","כינור":"🎻","שירי ילדים":"🎶","מקרר":"🧊","צעצוע":"🧸","מכונת כביסה":"🫧",
  "מכונת קפה":"☕","תריס":"🪟","צעדים":"👣","ריצה":"🏃","שיעול":"🤧","התעטשות":"🤧","נחירות":"😴","שריקה":"😗","ילדים משחקים":"🧒",
  "נביחה":"🐶","מיאו":"🐱","ציפורים":"🐦","ציוץ":"🐦","גשם":"🌧","רעם":"⛈","רכב":"🚗","סירנה":"🚨","צליל לא מזוהה":"❔",
  "צחוק":"😂","בכי":"😢","צעקה":"📢","צעקות ילדים":"📢","מוזיקה":"🎵","שירה":"🎤","טלוויזיה":"📺","רדיו":"📻",
  "כלב":"🐶","חתול":"🐱","כלים":"🍽","דלת":"🚪","פעמון":"🔔","שואב אבק":"🧹","טלפון":"📱","מחיאות כפיים":"👏","משחק מחשב":"🎮","מלמול תינוק":"👶"};
const HOW = {user: "סימנת", voice: "לפי הקול", context: "לפי ההקשר"};
const J0 = (s, d) => { try { return JSON.parse(s || "") ?? d; } catch { return d; } };
let day = null, phoneOnline = false;
function toast(t){ const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 4500); }

const ago = s => s < 60 ? `לפני ${s} שנ׳` : s < 3600 ? `לפני ${Math.round(s / 60)} דק׳` : `לפני ${Math.round(s / 3600)} שעות`;
let COV = null, HEALTH = null;
const LINK = {lan: ["🏠 בבית", ""], tailscale: ["🛰 Tailscale", "ts"]};
const LEG = [["rec", "var(--sage)", "הוקלט"], ["private", "#c9a3e6", "פרטי/מושהה"], ["battery", "var(--rose)", "סוללה"], ["busy", "var(--accent)", "מיקרופון תפוס"],
  ["killed", "#8a4a47", "האפליקציה נעצרה"], ["away", "#5c554d", "לא בבית/ממתין לקול"], ["unknown", "#e5484d", "הטלפון לא ענה"]];
function stripOf(code){
  const c = COV && COV.phones.find(x => x.code === code);
  if (!c) return "";
  const R = COV.reasons;
  const cells = c.cells.map((st, i) => `<i class="${st}" title="${String(Math.floor(i / 4)).padStart(2, "0")}:${String((i % 4) * 15).padStart(2, "0")} · ${esc(st === "future" ? "" : (R[st] || st))}"></i>`).join("");
  const h = c.hours, rec = (h.rec || 0);
  const gaps = Object.entries(h).filter(([k]) => k !== "rec" && h[k] >= 0.1).map(([k, v]) => `${esc(R[k] || k)} ${v.toFixed(1)} ש׳`).join(" · ");
  return `<div class="strip">${cells}</div><div class="stripaxis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    <div class="legend" style="margin-top:4px">היום: הוקלט ${rec.toFixed(1)} שעות${gaps ? " · פערים: " + gaps : ""}</div>`;

function phoneCard(p){

  const link = LINK[p.via] || ["", ""];

    p.bat && +p.bat > 0 ? `<span class="pill ${+p.bat < 15 && p.charging !== "1" ? "warn" : ""}">🔋 ${p.bat}%${p.charging === "1" ? " ⚡" : ""}</span>` : "",
    q ? `<span class="pill ${oldest > 48 * 3600 ? "warn" : ""}">ממתינים בטלפון: ${q}${p.qmb ? " · " + p.qmb + " MB" : ""}${oldest > 120 ? " · הישן " + ago(oldest).replace("לפני ", "מלפני ") : ""}</span>` : "",

function toneChart(U){
  const pts = U.filter(u => u.arousal != null);
  if (pts.length < 3) return "";
  const t0 = new Date(U[0].t0), T = (new Date(U[U.length - 1].t1) - t0) || 1;
  const X = u => ((new Date(u.t0) - t0) / T * 980 + 10).toFixed(1);
  const line = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="2" points="${pts.map(u => `${X(u)},${(80 - u[k] * 70).toFixed(1)}`).join(" ")}"/>`;
  const dots = pts.map(u => `<circle cx="${X(u)}" cy="${(80 - u.arousal * 70).toFixed(1)}" r="3.5" fill="${colorOf(u.name)}"/>`).join("");
  return `<svg class="tone" viewBox="0 0 1000 90" preserveAspectRatio="none" style="direction:ltr">${line("valence", "var(--sage)")}${line("arousal", "var(--accent)")}${dots}</svg>
    <div class="legend"><span style="color:var(--accent)">━ עוררות (כמה אנרגטי/נסער)</span> · <span style="color:var(--sage)">━ חיוביות</span> · נקודה בצבע הדובר</div>`;
}
const EMO = {angry:"כעס",happy:"שמחה",sad:"עצב",fearful:"פחד",surprised:"הפתעה",disgusted:"גועל",neutral:"ניטרלי"};
function feel(u){
  const out = [];
  if (u.emotion && u.emotion !== "neutral" && u.emotion !== "other" && u.emotion_p >= .8) out.push(`<span>${EMO[u.emotion] || u.emotion}</span>`);
  const r = u.rel || {};
  if (r.f0_hz != null && Math.abs(r.f0_hz) >= 25) out.push(`<span class="${r.f0_hz > 0 ? "hi" : "lo"}">קול ${r.f0_hz > 0 ? "גבוה" : "נמוך"} מהרגיל</span>`);
  if (r.intensity_db != null && Math.abs(r.intensity_db) >= 5) out.push(`<span class="${r.intensity_db > 0 ? "hi" : "lo"}">${r.intensity_db > 0 ? "חזק" : "שקט"} מהרגיל</span>`);
  if (r.syll_per_s != null && Math.abs(r.syll_per_s) >= 1.2) out.push(`<span class="${r.syll_per_s > 0 ? "hi" : "lo"}">${r.syll_per_s > 0 ? "מהר" : "לאט"} מהרגיל</span>`);
  if (u.arousal != null && u.arousal >= .8) out.push(`<span class="hi">נסער/אנרגטי</span>`);
  return out.join("");
}

async function teachOne(u, body){
  const r = await POST("/home/api/label", Object.assign({utt_id: u.id}, body));
  if (!r.ok) return toast("לא נשמר: " + (r.msg || ""));
  toast(r.name === "טלוויזיה" ? `סומן כטלוויזיה.${r.renamed ? ` עוד ${r.renamed} משפטים דומים סומנו.` : ""}`
      : `למדתי: ${r.name}.${r.renamed ? ` זיהיתי מחדש עוד ${r.renamed} משפטים.` : ""}`);
  showTeach();
}
function teachCount(n){ const e = $("#teachn"); if (n) { e.hidden = false; e.textContent = n > 99 ? "99+" : n; } else e.hidden = true; }
document.addEventListener("keydown", e => {
  if (!location.hash.startsWith("#teach") || !T || !T.items.length || document.querySelector(".sheet") || e.target.closest("input")) return;
  const u = T.items[tcur];
  if (e.key === "Enter" && u.guess && u.guess_sim >= .25) { e.preventDefault(); teachOne(u, {speaker: u.guess}); }
  else if (/^[1-9]$/.test(e.key) && HOUSE[+e.key - 1]) teachOne(u, {speaker: HOUSE[+e.key - 1].id});
  else if (e.key.toLowerCase() === "t" || e.key === "א") teachOne(u, {speaker: "__tv__"});
  else if (e.key.toLowerCase() === "s" || e.key === "ד") { tcur = Math.min(tcur + 1, T.items.length - 1); showTeach(); }
  else if (e.key === " ") { e.preventDefault(); const a = document.querySelector(".tcard.cur audio"); if (a) { a.currentTime = 0; a.play(); } }
});

      <div class="legend">נשמרים לצמיתות: תמלול, דוברים, טון, רגש, תגי צלילים, חתימות קול ושיחות. שמע של צלילים ושל לימוד קול נמחק.</div></div>
    <div class="card"><h2>מודל תמלול</h2>
      <div class="kv"><span>מודל נוכחי</span><b style="direction:ltr;display:inline-block">${esc(A.model)}</b>
        <span>בדיקה אחרונה</span><span>${A.last ? A.last.slice(0, 10) : "עוד לא נבדק"} · הבאה: ${esc(A.next)}</span>
        <span>שגיאות מילים (WER)</span><span>${A.wer != null ? (A.wer * 100).toFixed(1) + "%" : "לא נמדד (אין סט זהב)"}</span>
        <span>סט זהב</span><span>${A.gold_items} משפטים ${A.gold_items < 20 ? "· מומלץ לפחות 20 (כפתור ⭐ ליד משפט בשיחה)" : ""}</span>
        <span>בדיקה כל 3 חודשים</span><span>${A.enabled ? "פעילה" : "כבויה אחרי 3 בדיקות בלי שיפור"} ${A.enabled ? "" : '<button class="ok" id="asron">הפעל מחדש</button>'}</span></div>
      ${A.note ? `<div class="legend" style="color:var(--accent)">${esc(A.note)}</div>` : ""}
      <div class="legend">מודל חדש מאומץ רק אם הוא טוב ב-10% או יותר על הסט הזהב שלך.</div></div>`;
  const on = $("#asron");
  if (on) on.onclick = async () => { await POST("/home/api/asr_check", {enabled: true}); showSystem(); };
}
// ---------------------------------------------------------------- people
async function showPeople(){
  $("#days").innerHTML = "";
  const P = await J("/home/api/people_stats");
  if (!P.people.length) { $("#main").innerHTML = `<div class="empty">עוד אין אנשים מזוהים. התחל ב"ללמד קולות".</div>`; return; }
  const days = [...Array(14)].map((_, i) => { const d = new Date(P.since + "T12:00:00"); d.setDate(d.getDate() + i); return d.toISOString().slice(0, 10); });
  $("#main").innerHTML = `<div class="legend" style="margin:12px 0">14 הימים האחרונים · דקות דיבור ביום</div><div class="people">${P.people.map(p => {
    const mx = Math.max(1, ...Object.values(p.days));
    const bars = days.map(d => { const v = p.days[d] || 0;
      return `<i class="${v ? "" : "z"}" title="${d.slice(8)}/${d.slice(5, 7)}: ${v} דק׳" style="height:${v ? Math.max(6, v / mx * 100) : 4}%;${v ? `background:${colorOf(p.name)}` : ""}"></i>`; }).join("");
    const mood = p.valence == null ? "" : ` · מצב רוח בקול: <span style="color:${moodColor(p.valence)}">${p.valence >= .58 ? "רגוע/חיובי" : p.valence <= .42 ? "מתוח" : "ביניים"}</span>`;
    return `<div class="pcard"><div class="nm" style="color:${colorOf(p.name)}">${esc(p.name)}</div>
      <div class="spark">${bars}</div>
      <div class="meta">${p.minutes} דקות · ${p.lines} משפטים${mood}</div>
      ${p.with.length ? `<div class="meta">מדבר/ת הכי הרבה עם: ${p.with.map(w => esc(first(w.name))).join(", ")}</div>` : ""}
      <div class="meta">${p.taught ? `לימדת ${p.taught} דוגמאות קול` : "עוד לא לימדת דוגמאות מהטלפון"}</div>
      ${p.last ? `<div class="last">״${esc(p.last.text.slice(0, 120))}״ <span class="t">${p.last.t0.slice(5, 10).split("-").reverse().join("/")} ${hm(p.last.t0)}</span></div>` : ""}</div>`;
  }).join("")}</div>`;
}


// ---------------------------------------------------------------- search, questions, tasks
const mark = t => esc(t).replace(/«/g, "<mark>").replace(/»/g, "</mark>");
async function showSearch(){
  $("#days").innerHTML = "";
  const T = await J("/home/api/tasks");
  const tasks = T.map(t => `<div class="utt" data-t="${t.id}"><div class="body"><b>${esc(t.who)}</b>: ${esc(t.what)}${t.due ? ` <span class="chip">${esc(t.due)}</span>` : ""}
      <div class="legend" style="margin:2px 0 0">״${esc(t.quote)}״ · ${t.conv_start ? t.conv_start.slice(8, 10) + "/" + t.conv_start.slice(5, 7) + " " + hm(t.conv_start) : ""}${t.place ? " · " + esc(t.place) : ""}
      · <a href="#c${t.conv_id}" style="color:var(--accent)">לשיחה</a></div></div>
      <button class="act" data-s="done">בוצע</button><button class="act" data-s="dismissed">לא רלוונטי</button></div>`).join("");
  $("#main").innerHTML = `<div class="card"><h2>חיפוש בשיחות</h2>
      <div class="new" style="margin:0"><input id="q" placeholder="מה חיפשת? למשל: חוזה, רופא, המחיר שדיברנו עליו"><button class="ok" id="dosearch">חפש</button><button class="ok" id="doask" style="background:var(--sage)">שאל</button></div>
      <div class="chips" id="rng" style="margin-top:8px">${[["today","היום"],["yesterday","אתמול"],["week","7 ימים"],["month","30 יום"],["all","הכל"]].map(([k, t]) =>
        `<button class="chip ${k === (window.SR || "today") ? "prov" : ""}" data-r="${k}" style="border:0;cursor:pointer;font-size:14px;padding:4px 12px">${t}</button>`).join("")}
        <button class="ok" id="dosum" style="margin-inline-start:auto">סכם את התקופה</button></div>
      <div class="legend">"חפש" מציג שיחות שמכילות את המילים (בלי מילים: כל שיחות התקופה). "שאל" מנסח תשובה קצרה, רק מתוך מה שנאמר (דגם מקומי, בלי ענן).
      "סכם את התקופה" כותב סיכום לכל התקופה שנבחרה.</div><div id="sres"></div></div>
    <div class="card"><h2>משימות והתחייבויות שנאמרו</h2>${tasks || '<div class="legend">אין משימות פתוחות. המחשב מחלץ אותן אחרי כל שיחה (רק מה שנאמר במפורש, עם ציטוט).</div>'}</div>`;
  const run = async ask => {
    const q = $("#q").value.trim(); const r = window.SR || "today";
    if (!q && ask) return toast("כתוב שאלה");
    $("#sres").innerHTML = '<div class="legend">מחפש…</div>';
    const conv = c => `<div class="card conv" data-id="${c.id}" style="margin-top:8px"><div class="when">${c.start.slice(0, 10)} ${hm(c.start)} ${c.place ? "· 📍 " + esc(c.place) : ""}</div>
      <div class="topic">${esc(c.topic || "שיחה")}</div>${c.snippet ? `<div class="sum">${mark(c.snippet)}</div>` : c.summary ? `<div class="sum">${esc(c.summary)}</div>` : ""}</div>`;
    if (ask) {
      const a = await J("/home/api/ask?r=" + r + "&q=" + encodeURIComponent(q));
      $("#sres").innerHTML = `<div class="card" style="margin-top:8px"><div class="sum">${esc(a.answer || "לא הצלחתי לנסח תשובה")}</div></div>` + (a.conversations || []).map(conv).join("");
    } else {
      const a = await J("/home/api/search?r=" + r + "&q=" + encodeURIComponent(q));
      $("#sres").innerHTML = a.results.length ? `<div class="legend">${a.results.length} שיחות</div>` + a.results.map(conv).join("") : '<div class="empty">לא נמצא.</div>';
    }
    document.querySelectorAll("#sres [data-id]").forEach(e => e.onclick = () => location.hash = "c" + e.dataset.id);
  };
  $("#dosearch").onclick = () => run(false); $("#doask").onclick = () => run(true);
  document.querySelectorAll("#rng [data-r]").forEach(b => b.onclick = () => { window.SR = b.dataset.r;
    document.querySelectorAll("#rng [data-r]").forEach(x => x.classList.toggle("prov", x === b)); run(false); });
  $("#dosum").onclick = async () => {
    $("#sres").innerHTML = '<div class="legend">כותב סיכום…</div>';
    const S = await J("/home/api/range_summary?r=" + (window.SR || "week"));
    if (!S.ok) { $("#sres").innerHTML = `<div class="empty">${esc(S.msg || "לא הצליח")}</div>`; return; }
    const days = S.per_day.map(d => `<span class="chip">${d.day.slice(8)}/${d.day.slice(5, 7)}: ${d.n} שיחות · ${d.minutes} דק׳</span>`).join("");
    $("#sres").innerHTML = `<div class="card" style="margin-top:8px"><h2>סיכום ${esc({today: "היום", yesterday: "אתמול", week: "7 הימים האחרונים", month: "30 הימים האחרונים", all: "הכל"}[S.range])} · ${S.conversations} שיחות</h2>
      <div class="sum">${esc(S.summary)}</div>${S.highlights.map(h => `<div class="moment">${esc(h)}</div>`).join("")}
      ${Object.keys(S.by_person).length ? `<div class="pp">${Object.entries(S.by_person).map(([n, t]) => `<b style="color:${colorOf(n)}">${esc(first(n))}</b><span>${esc(t)}</span>`).join("")}</div>` : ""}
      <div class="chips">${days}</div></div>`;
  };
  window.SR ||= "today"; document.querySelector(`#rng [data-r="${window.SR}"]`)?.click();
  $("#q").onkeydown = e => { if (e.key === "Enter") run(false); };
  document.querySelectorAll("[data-t] .act").forEach(b => b.onclick = async () => {
    await POST("/home/api/task", {id: +b.closest("[data-t]").dataset.t, state: b.dataset.s}); showSearch(); });
}

// ---------------------------------------------------------------- me
async function showMe(){
  await days();
  const M = await J("/home/api/me?d=" + day);
  if (!M.seconds) { $("#main").innerHTML = `<div class="empty">הקול שלך לא נשמע ביום הזה (או שהטלפון עוד לא למד אותו: ראה "פרטיות").</div>`; return; }
  const pace = M.pace && M.pace_usual ? ` · ${M.pace} הברות/שנ׳ (הרגיל שלך ${M.pace_usual})` : M.pace ? ` · ${M.pace} הברות/שנ׳` : "";
  const where = Object.entries(M.where_min || {}).map(([k, v]) => `<span class="chip">📍 ${esc(k)}: ${v} דק׳</span>`).join("");
  $("#main").innerHTML = `<div class="card"><h2>הדיבור שלי · ${day.slice(8)}/${day.slice(5, 7)}</h2>
    <div class="kv" style="grid-template-columns:auto 1fr;display:grid;gap:6px 14px">
      <span>זמן דיבור</span><b>${mins(M.seconds)} · ${M.words} מילים · ${M.conversations} שיחות</b>
      <span>חלק מהדיבור בשיחות</span><b>${M.share != null ? Math.round(M.share * 100) + "%" : "—"}</b>
      <span>קצב</span><b>${pace.slice(3) || "—"}</b>
      <span>מילות מילוי</span><b>${M.fillers_per_100 != null ? M.fillers_per_100 + " ל-100 מילים" : "—"}</b>
      <span>קטיעות</span><b>קטעת ${M.cut_others} · נקטעת ${M.was_cut}</b></div>
    <div class="chips" style="margin-top:10px">${where}</div>
    <div class="legend">המדדים נמדדים רק על הדיבור שזוהה כשלך. כלי לתצפית עצמית, לא ציון.</div></div>`;
}

// ---------------------------------------------------------------- privacy
async function showPrivacy(){
  $("#days").innerHTML = "";
  const [P, people, S] = await Promise.all([J("/home/api/privacy"), J("/home/api/people"), J("/home/api/status")]);
  const why = {"owner-not-in-conversation": "הקול שלך לא היה בשיחה", "mute-place": "אזור פרטי", "bystander": "דוברים רחוקים", "optout": "ביקשו לא להיות מוקלטים"};
  const dropped = P.dropped_14d.length ? P.dropped_14d.map(d => `<div class="srow">${esc(why[d.reason] || d.reason)}: ${d.utterances} משפטים${d.seconds ? ` · ${Math.round(d.seconds)} שנ׳` : ""}</div>`).join("") : '<div class="legend">עוד לא נמחק כלום.</div>';
  const own = Object.entries(P.owner_samples).map(([d, n]) => `<span class="chip ${n >= P.min_samples ? "sig" : ""}">${esc(d)}: ${n} דגימות ${n >= P.min_samples ? "✓" : "(עוד לא מספיק)"}</span>`).join("") || '<span class="chip">אף טלפון עוד לא למד את הקול שלך (באפליקציה: "ללמד את הקול שלי")</span>';
  $("#main").innerHTML = `
    <div class="card"><h2>הכלל מחוץ לבית</h2>
      <div class="sum">הטלפון האישי שומר רק שיחות שהקול שלך נשמע בהן (לפחות ${P.owner_min_seconds} שנ׳). כל שיחה אחרת, וגם הקלטות שנשארו ממנה, נמחקות מהמחשב אחרי הניתוח. דוברים לא מזוהים שקטים ב-${P.bystander_db} דציבל ויותר מהקול שלך נחשבים עוברי אורח ונמחקים. שיחה שסימנת ⭐ נשמרת תמיד.</div>
      <div class="chips" style="margin-top:8px">${own}</div>
      <div class="grp" style="margin-top:12px;color:var(--faint);font-size:12px">נמחק ב-14 הימים האחרונים</div>${dropped}
      <div class="new" style="display:flex;gap:6px;margin-top:10px"><span style="align-self:center">שיחה צריכה לפחות</span><input id="oms" type="number" value="${P.owner_min_seconds}" style="flex:0 0 70px"><span style="align-self:center">שנ׳ שלך · עוברי אורח מעל</span><input id="bdb" type="number" value="${P.bystander_db}" style="flex:0 0 70px"><span style="align-self:center">dB</span><button class="ok" id="savepv">שמור</button></div></div>
    <div class="card"><h2>מי ביקש לא להיות מוקלט</h2>
      <div class="legend">הקול שלהם ממשיך להיות מוכר כדי שאפשר יהיה לזהות ולמחוק: כל מה שהם אומרים נמחק מיד, גם בבית, ולא נשמר בעתיד.</div>
      <div class="chips">${P.optout.map(o => `<span class="chip">${esc(o.name)} <button class="act" data-un="${o.id}">הסר</button></span>`).join("") || '<span class="legend">אף אחד.</span>'}</div>
      <div class="new" style="display:flex;gap:6px;margin-top:10px"><select id="optsel" style="flex:1;background:var(--surface2);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:6px">${people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><button class="ok" id="addopt">הוסף</button></div></div>
    <div class="card"><h2>מקומות</h2>
      ${P.places.map(x => `<div class="srow">📍 ${esc(x.name)} · רדיוס ${x.r_m} מ׳ · ${x.mute ? "<b style='color:var(--rose)'>פרטי: נמחק</b>" : "שם בלבד"} <button class="act" data-pd="${x.id}">מחק</button></div>`).join("") || '<div class="legend">אין מקומות. שמות נוספים מתוך שיחה: "תן שם למקום הזה". אזורי השתקה בטלפון עצמו: באפליקציה ← "אזורים פרטיים".</div>'}</div>
    <div class="card"><h2>ייבוא הקלטות</h2>
      <div class="legend">תיקיות במחשב (אחת בכל שורה) שמסתנכרנות מהטלפון: הודעות קוליות מוואטסאפ, הקלטות שיחה. כל קובץ חדש נקרא כשיחה נפרדת. מהטלפון אפשר גם: שיתוף ← שמע.</div>
      <textarea id="dirs" rows="3" style="width:100%;margin-top:6px;background:var(--surface2);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px;direction:ltr;font:inherit">${esc(P.import_dirs.join("\n"))}</textarea>
      <div class="new" style="margin-top:6px"><button class="ok" id="savedirs">שמור</button></div></div>`;
  $("#savepv").onclick = async () => { await POST("/home/api/privacy_set", {owner_min_seconds: +$("#oms").value, bystander_db: +$("#bdb").value}); toast("נשמר"); };
  $("#addopt").onclick = async () => { const id = $("#optsel").value, nm = $("#optsel").selectedOptions[0].textContent;
    if (!confirm(`למחוק לצמיתות את כל מה ש${nm} אמר/ה עד היום, ולא להקליט אותו/ה יותר?`)) return;
    const r = await POST("/home/api/optout", {id, on: true}); toast(`נמחקו ${r.deleted} משפטים`); showPrivacy(); };
  document.querySelectorAll("[data-un]").forEach(b => b.onclick = async () => { await POST("/home/api/optout", {id: b.dataset.un, on: false}); showPrivacy(); });
  document.querySelectorAll("[data-pd]").forEach(b => b.onclick = async () => { await POST("/home/api/place", {delete: +b.dataset.pd}); showPrivacy(); });
  $("#savedirs").onclick = async () => { await POST("/home/api/import_dirs", {dirs: $("#dirs").value.split("\n").map(x => x.trim()).filter(Boolean)}); toast("נשמר"); };
}

function route(soft){
  status();
  live();
  const h = location.hash;
  const tab = h.startsWith("#teach") ? "teach" : h.startsWith("#people") ? "people" : h.startsWith("#sounds") ? "sounds"
    : h.startsWith("#search") ? "search" : h.startsWith("#me") ? "me" : h.startsWith("#privacy") ? "privacy" : h.startsWith("#system") ? "system" : "day";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.t === tab));
  const m = h.match(/^#c(\d+)/);
  if (m) showConv(+m[1]); else if (tab === "teach") showTeach(); else if (tab === "people") showPeople();
  else if (tab === "search") showSearch(); else if (tab === "me") showMe(); else if (tab === "privacy") showPrivacy(); else if (tab === "system") showSystem();
  else if (tab === "sounds") showSounds(); else showDay();
  J("/home/api/teach").then(t => teachCount(t.left)).catch(() => {});
  J("/home/api/tasks").then(t => { const e = $("#taskn"); e.hidden = !t.length; e.textContent = t.length; }).catch(() => {});
}
window.onhashchange = () => route();
$("#store").onclick = showStorage;
$("#pairbtn").onclick = showPair;
if (location.hash === "#pair") showPair();
route();
covHealth();
setInterval(covHealth, 20000);
setInterval(() => { status(); live(); }, 4000);
setInterval(() => { if (!location.hash && !document.querySelector(".sheet")) showDay(); }, 30000);
setInterval(() => J("/home/api/teach").then(t => teachCount(t.left)).catch(() => {}), 30000);
</script>
